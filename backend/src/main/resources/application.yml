server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: true
  datasource.hikari:
    pool-name: WmsHikariPool
    connection-timeout: 5000
    validation-timeout: 3000
    maximum-pool-size: 10
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

jwt:
  # 必须由运行环境提供；请使用至少 32 字节的随机值。
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时毫秒

app:
  cors:
    # 多个来源用逗号分隔；生产环境请通过 CORS_ALLOWED_ORIGINS 覆盖。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
