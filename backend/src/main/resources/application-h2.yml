# ============================================================
# 本地开发备用配置：使用 H2 内存/文件数据库，无需安装 MySQL
# 启动方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# 或打包后：
#   java -jar wms-backend.jar --spring.profiles.active=h2
# ============================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/wms;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
